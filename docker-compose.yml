name: streamvault

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-streamvault}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-streamvault_root_password}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-streamvault_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-streamvault_dev_password}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-streamvault}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:-streamvault_app}:${MONGO_APP_PASSWORD:-streamvault_dev_password}@mongo:27017/${MONGO_DB_NAME:-streamvault}?authSource=${MONGO_DB_NAME:-streamvault}
      MONGODB_DB: ${MONGO_DB_NAME:-streamvault}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-media}
      MAX_UPLOAD_BYTES: "209715200"
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      replicas: 3
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep ok"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:

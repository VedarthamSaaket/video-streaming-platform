worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format upstream '$remote_addr - [$time_local] "$request" $status '
                      '$body_bytes_sent upstream=$upstream_addr rt=$request_time';
  access_log /var/log/nginx/access.log upstream;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 200m;

  upstream streamvault_backend {
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 80;
    server_name _;

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://streamvault_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      # Range requests must reach the API untouched.
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;

      # Streaming should not wait for a full buffer, uploads should not be buffered.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;

      # Show which backend answered each request.
      add_header X-Upstream-Addr $upstream_addr always;
    }
  }
}

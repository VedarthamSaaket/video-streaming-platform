global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: streamvault
    metrics_path: /metrics
    static_configs:
      - targets:
          - streamvault-worker:30080
        labels:
          cluster: kind-streamvault
          component: api

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

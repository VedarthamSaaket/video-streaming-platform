apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: streamvault-app
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: streamvault-app
  namespaceSelector:
    matchNames:
      - streamvault
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: streamvault

resources:
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: streamvault-grafana-dashboards
    files:
      - streamvault-app.json
      - streamvault-runtime.json
    options:
      labels:
        grafana_dashboard: "1"

generatorOptions:
  disableNameSuffixHash: true

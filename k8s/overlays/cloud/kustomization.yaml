apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: streamvault

resources:
  - ../../base
  - ingress.yaml

images:
  - name: streamvault
    newName: ghcr.io/vedarthamsaaket/video-streaming-platform
    newTag: latest

patches:
  - path: patch-mongo-storage.yaml
  - path: patch-nginx-service.yaml
  - path: patch-hpa-ceiling.yaml

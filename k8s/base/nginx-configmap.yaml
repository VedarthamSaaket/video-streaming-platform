apiVersion: v1
kind: ConfigMap
metadata:
  name: streamvault-nginx
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
      worker_connections 2048;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      log_format upstream '$remote_addr - [$time_local] "$request" $status '
                          '$body_bytes_sent upstream=$upstream_addr rt=$request_time';
      access_log /dev/stdout upstream;
      error_log /dev/stderr warn;

      sendfile on;
      tcp_nopush on;
      keepalive_timeout 65;
      client_max_body_size 200m;
      server_tokens off;

      gzip on;
      gzip_types application/json text/plain text/css application/javascript;
      gzip_min_length 1024;

      map $request_method $upload_client_key {
        default "";
        POST $binary_remote_addr;
      }

      limit_req_zone $upload_client_key zone=uploads:10m rate=10r/s;

      resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

      server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /nginx-health {
          access_log off;
          add_header Content-Type text/plain;
          return 200 "ok\n";
        }

        location / {
          set $streamvault_backend "streamvault-app-headless.streamvault.svc.cluster.local:3000";
          proxy_pass http://$streamvault_backend;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;

          proxy_set_header Range $http_range;
          proxy_set_header If-Range $http_if_range;

          proxy_buffering off;
          proxy_request_buffering off;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
          proxy_next_upstream error timeout http_502 http_503;

          # The map above gives GET and HEAD an empty key, so playback is not
          # rate limited while uploads still are.
          limit_req zone=uploads burst=20 nodelay;

          add_header X-Content-Type-Options nosniff always;
          add_header X-Frame-Options SAMEORIGIN always;
          add_header Referrer-Policy strict-origin-when-cross-origin always;
          add_header X-Upstream-Addr $upstream_addr always;
          add_header X-Upstream-Status $upstream_status always;
        }
      }
    }

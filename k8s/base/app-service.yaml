apiVersion: v1
kind: Service
metadata:
  name: streamvault-app
  labels:
    app: streamvault-app
spec:
  type: ClusterIP
  selector:
    app: streamvault-app
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: streamvault-app-headless
  labels:
    app: streamvault-app
spec:
  clusterIP: None
  selector:
    app: streamvault-app
  ports:
    - name: http
      port: 3000
      targetPort: http
